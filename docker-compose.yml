services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (see .env.example)}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build: ./src/SmsService.Api
    environment:
      ConnectionStrings__Default: "Server=db,1433;Database=SmsService;User Id=sa;TrustServerCertificate=True"
      Database__Password: ${MSSQL_SA_PASSWORD}
      SmsProvider__BaseUrl: ${SMS_PROVIDER_URL:-http://host.docker.internal:5005}
      # Empty (not set in .env) -> the defaults in SmsProviderOptions: "send" and "status/{id}".
      SmsProvider__SendPath: ${SMS_PROVIDER_SEND_PATH:-}
      SmsProvider__StatusPath: ${SMS_PROVIDER_STATUS_PATH:-}
    ports:
      - "8080:8080"
    extra_hosts:
      # Lets the container reach a provider simulator running on the host (needed on Linux; built in on Docker Desktop).
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  web:
    build: ./src/sms-web
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  sqldata:
